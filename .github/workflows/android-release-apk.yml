name: Android release APK

# Builds a SIGNED release APK and attaches it to a GitHub Release whenever
# a version tag is pushed, e.g. `git tag v0.0.0 && git push origin v0.0.0`.
#
# Signed with the real release key (KEYSTORE_BASE64/KEYSTORE_PASSWORD/
# KEY_ALIAS/KEY_PASSWORD secrets) — installable as a normal update path,
# not sideload-only. See app/build.gradle.kts's signingConfigs block for
# how these secrets reach Gradle; they're decoded/exported here, never
# committed or logged.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # required to create the Release and upload the asset

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure required Android SDK packages are installed
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          # android-35/build-tools;35.0.0 added alongside the existing 34
          # ones (not replacing them) — compileSdk moved to 35 in
          # app/build.gradle.kts, because Coil 3.3.0 transitively pulls
          # Compose UI 1.8.2, which needs compileSdk 35+. targetSdk/minSdk
          # are untouched, so the android-34 packages may still matter for
          # other tooling in this job; keeping both is the smaller, safer
          # diff over swapping one for the other.
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Show Kotlin and Gradle versions
        run: |
          java -version
          gradle --version
          gradle :app:buildEnvironment

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # $RUNNER_TEMP, not the checked-out workspace: it's per-job,
          # outside the git working tree (so there's no chance of it ever
          # ending up in a commit), and wiped when the runner VM is torn
          # down after this job finishes regardless of the explicit
          # cleanup step below — that step is defense-in-depth, not the
          # only thing standing between this file and persisting anywhere.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # github.run_number: auto-incrementing per workflow run, so this
          # is guaranteed to strictly increase across tags — see
          # defaultConfig's comment in build.gradle.kts for why that's
          # load-bearing, not cosmetic.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate and rename APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced — check the build log above." >&2
            exit 1
          fi
          RENAMED="app/build/outputs/apk/release/vault-${{ github.ref_name }}.apk"
          cp "$APK_PATH" "$RENAMED"
          echo "path=$RENAMED" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      - name: Remove decoded keystore
        if: always() # runs even if an earlier step failed, not just on success
        run: rm -f "$RUNNER_TEMP/release.jks"
